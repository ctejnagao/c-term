version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctej-dev-db
    restart: always
    environment:
      POSTGRES_USER: ctej_admin
      POSTGRES_PASSWORD: ctej8077
      POSTGRES_DB: ctej_erp_db
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ctej-dev-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com   # ← .local から変更
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  dev-db-data:
  